version: "3.8"

services:
    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: shorturl
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data

    redis:
        image: redis:alpine
        ports:
            - "6379:6379"

    app:
        build: .
        ports:
            - "8080:8080"
        environment:
            DATABASE_URL: "host=postgres port=5432 user=postgres password=postgres dbname=shorturl sslmode=disable"
            JWT_SECRET: "JWT-SECRET-KEY"
            REDIS_ADDR: "redis:6379"
        depends_on:
            - postgres
            - redis

volumes:
    postgres_data:

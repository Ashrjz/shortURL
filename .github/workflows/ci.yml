name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    backend:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.26"

            - name: Install dependencies
              run: go mod download

            - name: Build
              run: go build -v -o bin/app ./api

            - name: Test
              run: go test -v ./...

    frontend:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./frontend
        steps:
            - uses: actions/checkout@v5

            - name: Set up Node
              uses: actions/setup-node@v5
              with:
                  node-version: "24"

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

    docker:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Build backend image
              run: docker build -f api/Dockerfile -t url-shortener-api .

            - name: Build frontend image
              run: docker build -f frontend/Dockerfile -t url-shortener-frontend ./frontend
